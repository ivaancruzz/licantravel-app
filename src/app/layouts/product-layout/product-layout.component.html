<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
  <div>
    <div
      class="h-auto overflow-hidden flex md:sticky md:top-[30px]"
      style="border-radius: var(--border-radius)"
    >
      <app-thumbnails-product
        [images]="product.product_multimedia"
        [productName]="product.name"
      ></app-thumbnails-product>
    </div>
  </div>
  <div class="mt-5 flex flex-col gap-5">
    <h2 tuiTitle="xs">
      <div class="text-secondary font-bold text-4xl">{{ product.name }}</div>
      <div tuiSubtitle [style.color]="'var(--tui-text-primary)'">
        @if (product.price_off) {
          <div class="flex gap-2 items-center" class="font-bold text-3xl">
            <span [style.color]="'var(--tui-text-positive)'">{{
              product.price_off | currency: "CLP"
            }}</span>
            <span class="line-through text-sm">{{
              product.price | currency: "CLP"
            }}</span>
          </div>
        } @else {
          <span class="font-bold text-3xl">
            {{ product.price | currency: "CLP" }}</span
          >
        }
      </div>
      <div tuiSubtitle class="text-slate-500">
        <tui-icon
          icon="@tui.map-pin"
          [style.width.px]="15"
          [style.height.px]="15"
        />
        {{ product.providers?.commune }}
      </div>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <button
        *ngxPermissionsOnly="[Role.client, Role.anon]"
        [iconStart]="inCart() ? '@tui.check' : '@tui.shopping-cart'"
        size="l"
        tuiButton
        type="button"
        [appearance]="inCart() ? 'positive' : 'primary'"
        [disabled]="inCart()"
        class="w-full"
        (click)="addToCart()"
      >
        @if (inCart()) {
          Añadido
        } @else {
          Añadir al carrito
        }
      </button>
      @if (inCart()) {
        <button
          *ngxPermissionsOnly="[Role.client, Role.anon]"
          size="l"
          tuiButton
          type="button"
          appearance="secondary-destructive"
          class="w-full"
          (click)="removeFromCart()"
        >
          Quitar del carrito
        </button>
      }
    </div>
    <p class="whitespace-pre-line">
      {{ product.description }}
    </p>
  </div>
</div>
